<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>U.A.U membership detail</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;900&display=block" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
  :root { --paper: #f4f0e8; --paper-deep: #e8e0d3; --ink: #171817; --muted: #6d6a62; --blue: #1438ee; --blue-soft: #d9e0ff; --serif: "Noto Serif KR", serif; --sans: "Pretendard", "Helvetica Neue", sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1000px; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 26px; line-height: 1.6; word-break: keep-all; }
  .slice { position: relative; padding: 120px 80px; overflow: hidden; }
  .serif { font-family: var(--serif); }
  h2 { font-family: var(--serif); font-size: 64px; font-weight: 600; line-height: 1.22; letter-spacing: -.04em; }
  h2 em { font-style: normal; color: var(--blue); }
  .is-founding h2 em { color: var(--ink); font-weight: 900; }
  .lead { margin-top: 36px; font-size: 28px; line-height: 1.65; }
  .muted { color: var(--muted); }
  .dark { background: var(--ink); color: var(--paper); }
  .dark .muted { color: #b9b3a6; }
  .blue { background: var(--blue); color: #fff; }
  .deep { background: var(--paper-deep); }
  .soft { background: var(--blue-soft); }
  .tag { display: inline-block; padding: 8px 18px; background: var(--ink); color: var(--paper); font-size: 22px; font-weight: 700; }
  .blue .tag, .soft .tag { background: var(--blue); color: #fff; }
  .dark .tag { background: var(--paper); color: var(--ink); }
  .seal svg { display: block; width: 100%; height: auto; }

  /* 1. opening */
  .open { height: 1250px; padding: 0; background: #d8d2c7; }
  .open img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 70% 50%; }
  .open .copy { position: absolute; left: 80px; right: 80px; bottom: 96px; }
  .open .scrim { position: absolute; left: 0; right: 0; bottom: 0; height: 640px; background: rgba(244, 240, 232, .9); }
  .open h1 { font-family: var(--serif); font-size: 92px; font-weight: 600; line-height: 1.12; letter-spacing: -.05em; }
  .open .copy p { margin-top: 28px; font-size: 30px; }
  .open .brand { position: absolute; top: 64px; left: 80px; font-family: var(--serif); font-size: 34px; }
  .open .seal { position: absolute; right: 80px; bottom: 540px; width: 210px; }
  .is-founding .open .seal { padding: 12px; background: var(--paper); }

  /* 2. pains */
  .pains { display: grid; gap: 22px; margin-top: 64px; }
  .pain { display: grid; grid-template-columns: 250px 1fr; align-items: center; gap: 32px; padding: 34px 40px; background: var(--paper); }
  .pain strong { font-family: var(--serif); font-size: 46px; white-space: nowrap; font-weight: 600; letter-spacing: -.04em; line-height: 1; }
  .pain p { font-size: 25px; line-height: 1.5; }
  .pain small { display: block; margin-top: 6px; color: var(--muted); font-size: 19px; }

  /* 4. seal reveal */
  .reveal { text-align: center; }
  .reveal .seal { width: 460px; margin: 70px auto 0; }
  .is-founding .reveal .seal { padding: 22px; background: var(--paper); }
  .anatomy { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 64px; text-align: left; }
  .anatomy div { padding: 28px; background: rgba(255,255,255,.08); }
  .anatomy b { display: block; font-family: var(--serif); font-size: 32px; font-weight: 600; }
  .anatomy p { margin-top: 8px; font-size: 21px; line-height: 1.5; }

  /* benefit header */
  .num { font-family: var(--serif); font-size: 150px; font-weight: 900; line-height: .8; color: var(--blue); }
  .is-founding .num { color: var(--ink); }
  .dark .num { color: var(--paper); }

  /* 5. mock artist page */
  .mock { margin-top: 64px; background: #fff; }
  .mock-bar { display: flex; justify-content: space-between; padding: 22px 32px; font-size: 18px; color: var(--muted); background: var(--paper); }
  .mock-head { display: grid; grid-template-columns: 1fr 340px; gap: 36px; padding: 44px 40px; }
  .mock-head h3 { display: flex; align-items: center; gap: 14px; white-space: nowrap; font-family: var(--serif); font-size: 54px; font-weight: 400; letter-spacing: -.04em; line-height: 1.1; }
  .mock-head h3 .seal { width: 60px; flex: none; }
  .mock-head p { margin-top: 18px; font-size: 22px; color: var(--muted); }
  .art { display: block; width: 100%; object-fit: cover; }
  .mock-head .art { height: 300px; }
  .mock-list { display: grid; gap: 0; margin-top: 22px; background: #fff; }
  .mock-list > div { display: flex; align-items: center; justify-content: space-between; padding: 22px 40px; font-size: 24px; }
  .mock-list > div + div { background: #faf8f4; }
  .mock-list span { display: flex; align-items: center; gap: 8px; }
  .mock-list .seal { width: 26px; }
  .caption { margin-top: 18px; font-size: 19px; color: var(--muted); }

  /* 6. spotlight mock */
  .spot { margin-top: 64px; padding: 40px; background: var(--paper); color: var(--ink); }
  .spot-head { display: flex; justify-content: space-between; align-items: end; }
  .spot-head h3 { font-family: var(--serif); font-size: 50px; font-weight: 400; letter-spacing: -.04em; }
  .spot-head small { font-size: 18px; color: var(--muted); }
  .spot-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 28px; }
  .spot-grid .art { aspect-ratio: 4 / 5; }
  .spot-grid b { display: flex; align-items: center; gap: 6px; margin-top: 12px; font-size: 21px; }
  .spot-grid b .seal { width: 20px; }
  .spot-grid small { font-size: 16px; color: var(--muted); }
  .clock { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 40px; }
  .clock div { padding: 30px; background: rgba(255,255,255,.12); }
  .clock strong { display: block; font-family: var(--serif); font-size: 60px; font-weight: 600; line-height: 1; }

  /* 7. coming */
  .coming { display: grid; gap: 18px; margin-top: 56px; }
  .coming div { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 24px; padding: 34px 40px; background: var(--paper); }
  .coming b { font-family: var(--serif); font-size: 36px; font-weight: 600; }
  .coming p { margin-top: 4px; font-size: 21px; color: var(--muted); }
  .coming em { padding: 6px 14px; background: var(--paper-deep); font-style: normal; font-size: 19px; color: var(--muted); white-space: nowrap; }

  /* 8. price compare */
  .bars { display: grid; gap: 30px; margin-top: 70px; }
  .bar span { display: flex; justify-content: space-between; font-size: 23px; }
  .bar span b { font-family: var(--serif); font-size: 34px; font-weight: 600; }
  .bar i { display: block; height: 46px; margin-top: 10px; background: #cfc6b6; }
  .bar.is-us i { background: var(--blue); }
  .bar.is-founding-bar i { background: var(--ink); }
  .coffee { margin-top: 70px; padding: 48px; background: var(--ink); color: var(--paper); text-align: center; }
  .coffee strong { display: block; font-family: var(--serif); font-size: 96px; font-weight: 600; letter-spacing: -.04em; line-height: 1.1; }

  /* 9. founding */
  .seats { display: grid; grid-template-columns: repeat(20, 1fr); gap: 7px; margin-top: 64px; }
  .seats i { aspect-ratio: 1; background: rgba(244,240,232,.18); }
  .seats i.on { background: var(--paper); }
  .found-list { display: grid; gap: 18px; margin-top: 60px; }
  .found-list div { display: grid; grid-template-columns: 70px 1fr; gap: 20px; align-items: start; }
  .found-list b { font-family: var(--serif); font-size: 44px; font-weight: 900; line-height: 1.1; }
  .found-list p { font-size: 26px; }
  .found-list p small { display: block; color: #b9b3a6; font-size: 21px; }

  /* 10. promises */
  .promise { display: grid; gap: 22px; margin-top: 60px; }
  .promise div { padding: 40px; background: var(--paper); }
  .promise b { display: block; font-family: var(--serif); font-size: 40px; font-weight: 600; }
  .promise p { margin-top: 10px; font-size: 23px; color: var(--muted); }

  /* 11. steps */
  .steps { display: grid; gap: 0; margin-top: 60px; }
  .step { display: grid; grid-template-columns: 120px 1fr; gap: 28px; padding: 36px 0; }
  .step + .step { border-top: 2px solid rgba(255,255,255,.25); }
  .step b { font-family: var(--serif); font-size: 72px; font-weight: 900; line-height: 1; }
  .step h4 { font-family: var(--serif); font-size: 38px; font-weight: 600; }
  .step p { margin-top: 6px; font-size: 23px; }
  .notice { margin-top: 36px; padding: 30px 34px; background: rgba(255,255,255,.14); font-size: 22px; }

  /* 12. faq */
  .faq { display: grid; gap: 18px; margin-top: 56px; }
  .faq div { padding: 34px 40px; background: var(--paper-deep); }
  .faq b { display: block; font-size: 27px; }
  .faq b::before { content: "Q. "; color: var(--blue); font-family: var(--serif); }
  .is-founding .faq b::before { color: var(--ink); }
  .faq p { margin-top: 10px; font-size: 23px; color: #3b3a36; }

  /* 13. close */
  .close { text-align: center; padding-top: 150px; padding-bottom: 150px; }
  .close .seal { width: 240px; margin: 0 auto 56px; }
  .is-founding .close .seal { padding: 14px; background: var(--paper); }
  .close .price { margin-top: 44px; font-family: var(--serif); font-size: 120px; font-weight: 600; letter-spacing: -.05em; line-height: 1; }
  .close .price s { display: block; margin-bottom: 10px; font-size: 40px; font-weight: 400; color: #b9b3a6; }
  .close .price small { display: block; margin-top: 16px; font-family: var(--sans); font-size: 26px; font-weight: 400; letter-spacing: 0; }
</style>
</head>
<body>
<main id="page"></main>
<script>
const isFounding = new URLSearchParams(location.search).get("tier") === "founding";
document.body.className = isFounding ? "is-founding" : "is-member";
const P = "#f4f0e8";
const T = (x, y, s, c) => `<text x="${x}" y="${y}" font-size="${s}" text-anchor="middle" font-family="'Noto Serif KR', serif" font-weight="900" fill="${P}">${c}</text>`;
// Same geometry as app/components/uau-seal.tsx.
function seal(tier = isFounding ? "founding" : "member", variant = "full") {
  const color = tier === "founding" ? "#171817" : "#1438ee";
  let inner = "";
  if (variant === "letter") inner = tier === "founding" ? `<path d="M7 7.5 L41 7 L40.5 41 L7.5 40.5 Z" fill="none" stroke="${P}" stroke-width="2"/>${T(24, 32, 20, "U")}` : T(24, 33, 24, "U");
  else if (tier === "member") inner = `<path d="M6.5 7 L41.5 6.5 L41 41.5 L7 41 Z" fill="none" stroke="${P}" stroke-width=".8"/><path d="M24 8v32M8 24h32" stroke="${P}" stroke-width=".8"/>${T(15, 20.5, 12, "U")}${T(33, 20.5, 12, "A")}<path d="M11 36.5v-6.5h6.5" fill="none" stroke="${P}" stroke-width="2"/><rect x="15" y="33" width="3.5" height="3.5" fill="${P}"/>${T(33, 37.5, 12, "U")}`;
  else inner = `<path d="M6 6.5 L42 6 L41.5 42 L6.5 41.5 Z" fill="none" stroke="${P}" stroke-width=".8"/><path d="M8 8.5 L40 8 L39.5 40 L8.5 39.5 Z" fill="none" stroke="${P}" stroke-width=".8"/><path d="M24 9v30M9 24h30" stroke="${P}" stroke-width=".8"/>${T(15.5, 20, 11, "U")}${T(32.5, 20, 11, "A")}<path d="M11.5 35.5v-6h6" fill="none" stroke="${P}" stroke-width="1.8"/><rect x="15.3" y="32.3" width="3.2" height="3.2" fill="${P}"/>${T(32.5, 36.5, 11, "U")}`;
  return `<div class="seal"><svg viewBox="0 0 48 48"><path d="M3 4.5 L24 3 L45 4 L44.5 24 L45.5 44.5 L24 45 L3.5 44 L4 24 Z" fill="${color}"/>${inner}</svg></div>`;
}
const tpl = "../../../public/assets/artist-templates/";
const name = isFounding ? "창립 멤버" : "멤버";
const colour = isFounding ? "먹" : "블루";
const price = isFounding ? "35,000" : "59,000";
const month = isFounding ? "2,900" : "4,900";

const sections = [
  // 1 opening
  `<section class="slice open"><img src="../../../public/assets/uau-hero.webp" alt=""><div class="brand">U.A.U - UNFRAME Artist Unit</div><div class="scrim"></div>${seal()}<div class="copy">
    <span class="tag">${isFounding ? "선착순 100명 · 창립 멤버 1년권" : "U.A.U 멤버 1년권"}</span>
    <h1>${isFounding ? "단 100명에게만,<br>먹색 크레스트." : "작가의 이름 옆에,<br>작은 크레스트 하나."}</h1>
    <p>${isFounding ? "U.A.U의 첫해를 함께 열어 갈 창립 아티스트 100명을 찾습니다." : "커피 한 잔 값으로, 당신의 작업이 더 명확하고 자주 보이게."}</p></div></section>`,
  // 2 pains
  `<section class="slice deep"><h2>작업에 몰두하기도 벅찬데,<br><em>알리는 비용</em>은 무겁습니다.</h2>
    <p class="lead">아티스트가 자신의 온전한 아카이브를 알리려면 생각보다 많은 비효율과 비용이 듭니다.</p>
    <div class="pains">
      <div class="pain"><strong>월 1~3만원</strong><p>해외 포트폴리오 서비스의 유료 플랜<small>Behance Pro, ArtStation Pro, Format 등 (2026년 기준, 연간 결제 시)</small></p></div>
      <div class="pain"><strong>30~40%</strong><p>온라인 판매 플랫폼이 가져가는 높은 중개 수수료<small>Saatchi Art, Artfinder 등 독립 판매 채널</small></p></div>
      <div class="pain"><strong>? ? ?</strong><p>언제 보여줄지 알 수 없는 SNS 알고리즘<small>올린 날 묻히면 그걸로 끝</small></p></div>
    </div></section>`,
  // 3 what is UAU
  `<section class="slice"><h2>U.A.U는 아티스트의 온전한 '기록과 연결'을 위한<br><em>지속 가능한 플랫폼</em>입니다.</h2>
    <p class="lead">UNFRAME이 만든 U.A.U에서 아티스트는 자신만의 웹페이지를 갖고, 작품·CV·전시 기록을 아카이빙하며, 컬렉터 또는 기획자의 문의를 직접 받습니다. <b>이 모든 기본 기능은 인증 아티스트라면 평생 무료입니다.</b><br>누구나 공정한 순서로 목록에 노출되고, 그 순서는 매일 오전 10시와 오후 6시에 다시 섞입니다.</p>
    <p class="lead">멤버십은 상업적인 입찰 광고가 아닙니다. <b>창작을 지키는 아티스트에게 더 명확한 시선의 기회를 더하는 신뢰의 연결입니다.</b></p></section>`,
  // 4 seal reveal
  `<section class="slice dark reveal"><span class="tag">MEMBERSHIP CREST</span><h2 style="margin-top:30px">이름 옆에 새겨지는<br>U.A.U ${name} 크레스트</h2>${seal()}
    <div class="anatomy"><div><b>U · A</b><p>상단은 Unframe Artist의 머리글자. 기존 틀을 벗어난 동시대 아티스트</p></div><div><b>□ · U</b><p>하단은 액자 틀과 Unit. 틀을 확장하는 아티스트들의 독립적 연대 단위.</p></div><div><b>${colour}</b><p>${isFounding ? "먹색은 창립 100인에게만 허락된 컬러. 테두리가 한 겹 더 새겨집니다." : "딥블루는 U.A.U 공식 멤버의 시그니처 컬러입니다."}</p></div></div></section>`,
  // 5 benefit 1
  `<section class="slice soft"><div class="num">01</div><h2 style="margin-top:36px">아티스트 페이지와 목록,<br>이름 옆에 <em>크레스트</em>가 붙습니다.</h2>
    <p class="lead">아티스트 페이지 상단에는 볼드한 크레스트가, 아카이브 목록과 추천 탭에는 컴팩트 크레스트가 표시됩니다. 컬렉터와 큐레이터는 이 작가가 U.A.U와 긴밀히 연대하는 멤버임을 직관적으로 확인합니다.</p>
    <div class="mock"><div class="mock-bar"><span>U.A.U / artist</span><span>작품 · CV · 문의</span></div><div class="mock-head"><div><h3>PRING 프링${seal()}</h3><p>Mixed media · Seoul</p><p style="color:var(--ink);margin-top:26px">보이지 않는 마음을 조용히 주워 담는<br>작은 친구예요.</p></div><img class="art" src="${tpl}editorial.jpg" style="object-view-box: inset(671px 274px 992px 351px)" alt=""></div></div>
    <div class="mock-list"><div><span>PRING 프링${seal(undefined, "letter")}</span><small class="muted">Mixed media · Seoul</small></div><div><span>다른 아티스트</span><small class="muted">Painting · Busan</small></div></div>
    <p class="caption">화면은 이해를 돕기 위한 예시입니다.</p></section>`,
  // 6 benefit 2
  `<section class="slice blue"><div class="num" style="color:#fff">02</div><h2 style="margin-top:36px">홈 화면 최상단,<br>멤버 스포트라이트.</h2>
    <p class="lead">U.A.U 홈 화면 첫 화면 바로 아래에 멤버 작가와 대표작이 소개됩니다. 하루 두 번 순서가 바뀌고, 모든 멤버에게 같은 횟수로 차례가 돌아갑니다. 돈을 더 낸 사람이 더 오래 머무는 구조가 아닙니다.</p>
    <div class="spot"><div class="spot-head"><h3>지금, 이 방에.</h3><small>MEMBER SPOTLIGHT</small></div><div class="spot-grid">
      <div><img class="art" src="${tpl}editorial.jpg" style="object-view-box: inset(56px 31px 1335px 263px)" alt=""><b>PRING 프링${seal(undefined, "letter")}</b><small>남겨진 마음 #01, 2026</small></div>
      <div><img class="art" src="${tpl}editorial.jpg" style="object-view-box: inset(660px 490px 992px 35px)" alt=""><b>멤버 작가${seal("member", "letter")}</b><small>대표작, 2026</small></div>
      <div><img class="art" src="${tpl}editorial.jpg" style="object-view-box: inset(992px 0px 635px 300px)" alt=""><b>멤버 작가${seal("founding", "letter")}</b><small>대표작, 2026</small></div>
    </div></div><p class="caption" style="color:#d9e0ff">화면은 이해를 돕기 위한 예시입니다.</p>
    <div class="clock"><div><strong>10:00</strong>오전 10시 교체</div><div><strong>18:00</strong>오후 6시 교체</div></div></section>`,
  // 7 coming
  `<section class="slice deep"><div class="num">03</div><h2 style="margin-top:36px">새롭게 열리는 도구도,<br><em>추가 비용 없이 우선 적용.</em></h2>
    <p class="lead">현재 순차적으로 구축 중인 아티스트 전용 툴셋입니다. 배포되는 즉시 멤버에게 추가 과금 없이 활성화됩니다. 아직 서비스되지 않는 기능을 과장하지 않기 위해, 준비 중임을 투명하게 밝힙니다.</p>
    <div class="coming">
      <div><div><b>아카이브 애널리틱스</b><p>작업 조회수 · 문의 추이 · 큐레이터 저장 수를 한 화면에서</p></div><em>준비 중</em></div>
      <div><div><b>포트폴리오 PDF 익스포트</b><p>워터마크 없이 인쇄/전달 가능한 규격 도록 내보내기</p></div><em>준비 중</em></div>
